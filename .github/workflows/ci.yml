name: 检查与测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: 接口测试
        run: npm test
      - name: 浏览器流程测试
        run: |
          npx playwright install --with-deps chromium
          SHOTS=shots npm run test:e2e
      - name: 上传流程截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: shots/
          if-no-files-found: ignore
